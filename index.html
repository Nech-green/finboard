<style>
:root{--f:'IBM Plex Sans Hebrew','Heebo',system-ui,-apple-system,sans-serif;--r:14px;--rs:9px}
[data-theme=dark]{--bg:#0E1217;--s1:#151B23;--s2:#1C2430;--s3:#263243;--ln:#2A3544;--t1:#E8EDF3;--t2:#A6B1C0;--t3:#717D8D;--acc:#E3B04B;--accs:rgba(227,176,75,.14);--pos:#4CC38A;--neg:#F07070;--dep:#8A96F5;--info:#6AA8F0;--ov:rgba(4,7,10,.66)}
[data-theme=light]{--bg:#F5F6F8;--s1:#FFFFFF;--s2:#F0F2F5;--s3:#E3E8EE;--ln:#DCE1E7;--t1:#16202B;--t2:#4E5A69;--t3:#7F8B9B;--acc:#A3700F;--accs:rgba(163,112,15,.1);--pos:#1C8653;--neg:#C93C3C;--dep:#4B59D3;--info:#2C6EC0;--ov:rgba(20,26,34,.45)}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--f);background:var(--bg);color:var(--t1);font-size:14px;line-height:1.55;min-height:100vh;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
a{color:var(--info)}
.hd{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:8px;padding:10px 18px;padding-top:calc(10px + env(safe-area-inset-top));background:var(--bg);border-bottom:1px solid var(--ln)}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:17px;letter-spacing:-.2px}
.mark{width:30px;height:30px;border-radius:9px;background:var(--acc);color:#14181F;display:grid;place-items:center;font-weight:700;font-size:16px}
.sync{width:8px;height:8px;border-radius:50%;background:var(--t3);margin-inline-start:2px}.sync.on{background:var(--pos)}.sync.busy{background:var(--acc)}.sync.off{background:var(--neg)}
.hd .sp{flex:1}
.ib{width:36px;height:36px;border-radius:50%;border:1px solid var(--ln);background:var(--s1);display:grid;place-items:center;cursor:pointer;font-size:15px}
.ib:hover{background:var(--s2)}.ib.on{background:var(--accs);border-color:var(--acc)}
.nav{display:flex;gap:2px;padding:0 18px;border-bottom:1px solid var(--ln);overflow-x:auto;background:var(--bg)}
.nav button{border:0;background:none;padding:11px 14px;color:var(--t2);cursor:pointer;font-weight:500;border-bottom:2px solid transparent;white-space:nowrap}
.nav button.on{color:var(--t1);border-bottom-color:var(--acc);font-weight:600}
.bnav{display:none}
main{max-width:1180px;margin:0 auto;padding:18px 18px 120px}
.pg{display:none}.pg.on{display:block}
.pn{background:var(--s1);border:1px solid var(--ln);border-radius:var(--r);padding:18px;margin-bottom:14px}
.pn h2{font-size:16px;font-weight:600;margin-bottom:2px}
.sub{color:var(--t2);font-size:13px;margin-bottom:12px}
.ttl{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.ttl h1{font-size:21px;font-weight:700;letter-spacing:-.3px}
.muted{color:var(--t2)}.dim{color:var(--t3)}.small{font-size:12.5px}
.pos{color:var(--pos)}.neg{color:var(--neg)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grid{display:grid;gap:14px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}
.hero{padding:22px 22px 18px}
.hero .lbl{color:var(--t2);font-size:13.5px}
.hero .big{font-size:42px;font-weight:700;letter-spacing:-1.2px;line-height:1.15;margin:6px 0 2px}
.split{display:flex;height:16px;border-radius:8px;overflow:hidden;background:var(--s3);margin:16px 0 10px}
.split i{display:block;height:100%}
.legend{display:flex;gap:6px 20px;flex-wrap:wrap;font-size:13px;color:var(--t2)}
.legend b{color:var(--t1);font-weight:600;margin-inline-start:4px}
.dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:7px;vertical-align:-1px}
.strip{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--ln);border-radius:var(--r);background:var(--s1);margin-bottom:14px}
.strip>div{padding:14px 16px;border-inline-start:1px solid var(--ln);min-width:0}
.strip>div:first-child{border-inline-start:0}
.strip .k{font-size:12.5px;color:var(--t2)}.strip .v{font-size:20px;font-weight:600;margin-top:2px}.strip .n{font-size:12px;color:var(--t3);margin-top:1px}
.al{display:flex;gap:12px;align-items:center;padding:11px 14px;border-radius:var(--rs);background:var(--s2);margin-bottom:8px}
.al .ic{font-size:17px}.al .tx{flex:1;font-size:13.5px;min-width:0}
.al.warn{background:var(--accs)}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{font-weight:500;color:var(--t3);font-size:12px;text-align:right;padding:8px 10px;border-bottom:1px solid var(--ln);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--ln);white-space:nowrap}
tr.cl{cursor:pointer}tr.cl:hover td{background:var(--s2)}
tr.tot td{font-weight:600;border-bottom:0;border-top:2px solid var(--ln)}
.fl{display:flex;flex-direction:column;gap:4px;min-width:0}
.fl>label{font-size:12.5px;color:var(--t2);font-weight:500}
.in{width:100%;padding:9px 11px;border:1px solid var(--ln);border-radius:var(--rs);background:var(--bg);font-size:14px;min-height:40px}
.in:focus{border-color:var(--acc);outline:none}
input.num{direction:ltr;text-align:right}
.fg{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.b{padding:9px 15px;border-radius:var(--rs);border:1px solid var(--ln);background:var(--s1);cursor:pointer;font-weight:500;font-size:13.5px;white-space:nowrap;min-height:40px}
.b:hover{background:var(--s2)}
.bp{background:var(--acc);border-color:var(--acc);color:#14181F;font-weight:600}
.bp:hover{background:var(--acc);filter:brightness(1.07)}
.bd{color:var(--neg)}
.bs{padding:5px 10px;font-size:12.5px;min-height:32px}
.b:disabled{opacity:.5;cursor:default}
.seg{display:inline-flex;border:1px solid var(--ln);border-radius:var(--rs);overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:var(--s1);padding:7px 12px;cursor:pointer;font-size:13px;color:var(--t2)}
.seg button.on{background:var(--s3);color:var(--t1);font-weight:600}
.tg{display:inline-block;font-size:11.5px;padding:2px 8px;border-radius:20px;background:var(--s2);color:var(--t2);white-space:nowrap}
.tg.biz{background:rgba(76,195,138,.14);color:var(--pos)}
.tg.dep{background:rgba(138,150,245,.16);color:var(--dep)}
.tg.tax{background:var(--accs);color:var(--acc)}
.tg.bad{background:rgba(240,112,112,.14);color:var(--neg)}
.li{display:flex;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px solid var(--ln)}
.li:last-child{border-bottom:0}
.li .d{color:var(--t3);font-size:12.5px;min-width:64px}
.li .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .a{font-weight:600;white-space:nowrap}
.xb{border:0;background:none;color:var(--t3);cursor:pointer;padding:4px 6px;border-radius:6px;font-size:13px}
.xb:hover{background:var(--s2);color:var(--t1)}
.bar{height:8px;border-radius:4px;background:var(--s3);overflow:hidden}.bar i{display:block;height:100%;background:var(--pos)}
.bar.over i{background:var(--neg)}
.kv{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--ln);font-size:13.5px}
.kv:last-child{border-bottom:0}.kv span:first-child{color:var(--t2)}
.kv.strong{font-weight:600}.kv.strong span:first-child{color:var(--t1)}
.mo{position:fixed;inset:0;background:var(--ov);z-index:200;display:none;align-items:center;justify-content:center;padding:14px}
.mo.on{display:flex}
.md{background:var(--s1);border:1px solid var(--ln);border-radius:16px;width:100%;max-width:560px;max-height:92vh;overflow:auto;padding:20px}
.md.wide{max-width:1000px}
.md h3{font-size:18px;margin-bottom:6px}
.mf{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}
#toast{position:fixed;bottom:calc(90px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:var(--t1);color:var(--bg);padding:11px 16px;border-radius:10px;font-size:13.5px;z-index:500;display:none;align-items:center;gap:14px;max-width:92vw}
#toast.on{display:flex}
#toast button{background:none;border:0;color:var(--acc);font-weight:700;cursor:pointer}
.fab{position:fixed;left:22px;bottom:calc(26px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;background:var(--acc);color:#14181F;border:0;font-size:30px;line-height:1;cursor:pointer;z-index:60;box-shadow:0 8px 22px rgba(0,0,0,.28)}
body.priv .money{filter:blur(7px);user-select:none}
.ov{position:fixed;inset:0;background:var(--bg);z-index:400;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px}
.ov.on{display:flex}
.spin{width:34px;height:34px;border:3px solid var(--ln);border-top-color:var(--acc);border-radius:50%;animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.login{max-width:380px}
.login h1{font-size:32px;letter-spacing:-.6px}
.gbtn{display:inline-flex;align-items:center;gap:10px;padding:12px 22px;border-radius:12px;border:1px solid var(--ln);background:var(--s1);cursor:pointer;font-weight:600;font-size:15px}
.steps{display:flex;gap:6px;margin:6px 0 16px}.steps i{flex:1;height:4px;border-radius:2px;background:var(--s3)}.steps i.on{background:var(--acc)}
.chart{position:relative;height:260px}.chart.s{height:220px}
.empty{text-align:center;padding:36px 16px;color:var(--t2)}
.pick{max-height:56vh;overflow:auto;margin-top:8px}
.pick button{display:block;width:100%;text-align:right;border:0;background:none;padding:9px 10px;border-radius:8px;cursor:pointer}
.pick button:hover{background:var(--s2)}.pick .gh{font-size:12px;color:var(--t3);padding:10px 10px 4px}
pre.code{direction:ltr;text-align:left;background:var(--bg);border:1px solid var(--ln);border-radius:var(--rs);padding:12px;font-size:12px;overflow:auto;white-space:pre}

.sv{border:1px solid var(--ln);border-radius:12px;padding:14px 16px;margin-bottom:10px;cursor:pointer;background:var(--s1)}
.sv:hover{background:var(--s2)}
.sv.top{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}
.sv-n{display:flex;align-items:center;gap:6px;margin-bottom:10px;font-size:15.5px}
.sv-g{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.sv-g span{display:block;font-size:12px;color:var(--t2)}
.sv-g b{font-size:17px;font-weight:600}
.sv-g small{font-size:12px;font-weight:500}
.v2{font-size:26px;font-weight:700;letter-spacing:-.5px;margin:2px 0 4px}
@media (max-width:760px){.sv-g{grid-template-columns:1fr 1fr}.v2{font-size:23px}}
@media (max-width:760px){
 .nav{display:none}
 .bnav{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:55;background:var(--s1);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom)}
 .bnav button{flex:1;border:0;background:none;padding:8px 2px 7px;font-size:11px;color:var(--t2);display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer}
 .bnav button span{font-size:19px;line-height:1.2}
 .bnav button.on{color:var(--acc);font-weight:600}
 .fab{bottom:calc(74px + env(safe-area-inset-bottom));left:16px}
 main{padding:14px 12px 160px}
 .g2,.g3{grid-template-columns:1fr}
 .strip{grid-template-columns:1fr 1fr}.strip>div:nth-child(3){border-inline-start:0}.strip>div:nth-child(n+3){border-top:1px solid var(--ln)}
 .hero{padding:18px}.hero .big{font-size:34px}
 .pn{padding:15px}
 .fg{grid-template-columns:1fr 1fr}
 .md{padding:16px}
 #toast{bottom:calc(140px + env(safe-area-inset-bottom))}
 .hide-m{display:none}
}
</style>
</head>

<script>
'use strict';
/* ============ כלים בסיסיים ============ */
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const Rn=n=>Math.round(n||0);
const nf=n=>Math.abs(Rn(n)).toLocaleString('he-IL');
function fmt(n){if(n==null||!isFinite(n))return'<span class="dim">—</span>';return'<span class="money">'+(n<0?'−':'')+'₪'+nf(n)+'</span>'}
function fmtS(n){if(n==null||!isFinite(n))return'<span class="dim">—</span>';return'<span class="money">'+(Rn(n)>0?'+':Rn(n)<0?'−':'')+'₪'+nf(n)+'</span>'}
function pct(n,d){if(n==null||!isFinite(n))return'—';d=d==null?1:d;const v=n*100;return(v>0.05?'+':v<-0.05?'−':'')+Math.abs(v).toFixed(d)+'%'}
const cls=n=>n>0.5?'pos':n<-0.5?'neg':'';
const MN=['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];
const MS=['ינו׳','פבר׳','מרץ','אפר׳','מאי','יוני','יולי','אוג׳','ספט׳','אוק׳','נוב׳','דצמ׳'];
const mLabel=m=>m?MN[+m.slice(5,7)-1]+' '+m.slice(0,4):'';
const mShort=m=>MS[+m.slice(5,7)-1]+' '+m.slice(2,4);
function addM(m,k){let y=+m.slice(0,4),mm=+m.slice(5,7)+k;while(mm>12){mm-=12;y++}while(mm<1){mm+=12;y--}return y+'-'+String(mm).padStart(2,'0')}
const mDiff=(a,b)=>(+b.slice(0,4)-+a.slice(0,4))*12+(+b.slice(5,7)-+a.slice(5,7));
function todayS(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
const curM=()=>todayS().slice(0,7);
const dLabel=d=>{const p=d.split('-');return +p[2]+'.'+(+p[1])+'.'+p[0].slice(2)};
const uid8=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const norm=s=>String(s||'').toLowerCase().replace(/["'״׳`]/g,'').replace(/\s+/g,' ').trim();
const hashRow=(d,signed,desc)=>d+'|'+Math.round(signed*100)+'|'+norm(desc).slice(0,30);
const sum=a=>a.reduce((x,y)=>x+(+y||0),0);

 document.addEventListener('visibilitychange',()=>{if(document.hidden)HID_AT=Date.now();else{const m=mins();if(m>0&&HID_AT&&!LOCKED&&U&&READY&&Date.now()-HID_AT>m*60000)lockNow()}})}
function lockNow(){if(!U)return;LOCKED=true;$('lockOv').classList.add('on');$('lockErr').textContent='';let has=false;try{has=!!localStorage.getItem('fb_pin')}catch(e){}$('lockPinWrap').hidden=!has;$('lockMsg').textContent=has?'הקלד את קוד הנעילה של המכשיר.':'המסך נעול. אפשר להגדיר קוד נעילה בהגדרות, בלשונית אבטחה.';if(has)setTimeout(()=>$('lockPin').focus(),60)}
async function unlock(){let h=null;try{h=localStorage.getItem('fb_pin')}catch(e){}if(h){const v=await sha($('lockPin').value||'');if(v!==h){$('lockErr').textContent='הקוד שגוי';$('lockPin').value='';return}}LOCKED=false;LAST_ACT=Date.now();$('lockPin').value='';$('lockOv').classList.remove('on')}
async function sha(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('fb|'+s));return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('')}
</script>
