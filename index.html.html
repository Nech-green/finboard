<div class="MO" id="rstM"><div class="MD"><h3>⚠️ איפוס כל הנתונים</h3><p>לפני המחיקה יישמר גיבוי אוטומטי בענן שניתן לשחזר מההגדרות. להמשיך?</p><div style="display:flex;gap:5px;justify-content:flex-end"><button class="B" onclick="$('rstM').classList.remove('op')">ביטול</button><button class="B Bd" onclick="resetAll()" style="background:var(--rdd)">מחק הכל</button></div></div></div>
<script>
const $=id=>document.getElementById(id);
// ===== רשת ביטחון: מסך הטעינה לא נתקע לעולם =====
window.addEventListener('error',function(e){
  var l=document.getElementById('loader');
  if(l&&l.style.display!=='none'){
    l.innerHTML='<p style="color:#f85149;font-size:13px;max-width:340px;text-align:center;line-height:1.7">⚠️ שגיאה בטעינת האתר<br><span style="color:#8b949e;font-size:11px">'+(e.message||'')+'</span><br><br>אם פתחת בתצוגה מקדימה או מקובץ מקומי — זה צפוי.<br>פתח את האתר בכתובת האמיתית (github.io).</p>';
  }
});
setTimeout(function(){
  var l=document.getElementById('loader');
  if(l&&l.style.display!=='none'&&l.querySelector('.sp')){
    l.style.display='none';
    var pl=document.getElementById('p-login');if(pl)pl.classList.add('on');
    var le=document.getElementById('loginErr');if(le)le.textContent='החיבור לשרת איטי או חסום. בדוק חיבור אינטרנט, או שפתחת בתצוגה מקדימה במקום בכתובת האמיתית.';
  }
},7000);
// ===== FIREBASE =====
let auth=null,db=null,uid=null,unsub=null;
try{
  firebase.initializeApp({apiKey:"AIzaSyD6juU66Z90OOLKmWFC3eio_o1s9HyB1aU",authDomain:"finboard-nech.firebaseapp.com",projectId:"finboard-nech",storageBucket:"finboard-nech.firebasestorage.app",messagingSenderId:"713113119743",appId:"1:713113119743:web:7f8af2dcec9c150c0ad5ca"});
  auth=firebase.auth();db=firebase.firestore();
}catch(e){console.error('Firebase init failed',e)}
const isMobile=/Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
function signIn(){
  if(!auth)return alert('החיבור ל-Google לא נטען. רענן את הדף ונסה שוב.');
  const prov=new firebase.auth.GoogleAuthProvider();
  if(isMobile){auth.signInWithRedirect(prov).catch(e=>{$('loginErr').textContent='שגיאת התחברות: '+e.message})}
  else{auth.signInWithPopup(prov).catch(e=>{
    if(e.code==='auth/popup-blocked'||e.code==='auth/popup-closed-by-user'){auth.signInWithRedirect(prov)}
    else{$('loginErr').textContent='שגיאת התחברות: '+e.message}
  })}
}
function togA(){uid?auth.signOut():signIn()}
if(auth)auth.onAuthStateChanged(u=>{
  $('loader').style.display='none';
  if(u){uid=u.uid;$('aB').textContent='התנתק';$('uI').textContent=u.displayName||'';$('sD').className='sd sd-on';$('nB').style.display='';$('p-login').classList.remove('on');startSync()}
  else{uid=null;$('aB').textContent='התחבר';$('uI').textContent='';$('sD').className='sd sd-off';$('nB').style.display='none';document.querySelectorAll('.P').forEach(p=>p.classList.remove('on'));$('p-login').classList.add('on');if(unsub){unsub();unsub=null}}
});
function startSync(){
  if(unsub)unsub();
  unsub=db.collection('users').doc(uid).collection('data').doc('main').onSnapshot(s=>{
    if(s.exists){S=s.data();migrate();renderCur()}
    else{S=defState();cloudSave();renderCur()}
  },e=>{console.error(e);$('sD').className='sd sd-off'});
}
function migrate(){
  if(!S.incomes)S.incomes=[];if(!S.expenses)S.expenses=[];if(!S.transfers)S.transfers=[];if(!S.taxPayments)S.taxPayments=[];
  if(!S.cats)S.cats=[...DEC];if(!S.months)S.months={};if(!S.accounts)S.accounts={};
  if(!S.fixedDeps)S.fixedDeps={'פנסיה':1500,'השתלמות':1540,'ביטוח ישיר - מניות':2000};
  if(!S.fixedDone)S.fixedDone={};
  delete S.salDeps;
}
async function cloudSave(){if(!uid)return;try{await db.collection('users').doc(uid).collection('data').doc('main').set(JSON.parse(JSON.stringify(S)));$('sD').style.background='var(--ac)';setTimeout(()=>$('sD').style.background='',400)}catch(e){console.error('save',e)}}
function save(){cloudSave()}
async function backupNow(){if(!uid)return;try{await db.collection('users').doc(uid).collection('data').doc('backup').set({at:new Date().toISOString(),data:JSON.stringify(S)})}catch(e){console.error('backup',e)}}
async function restoreBackup(){if(!uid)return;try{const s=await db.collection('users').doc(uid).collection('data').doc('backup').get();if(!s.exists)return alert('אין גיבוי שמור');const b=s.data();if(!confirm('לשחזר גיבוי מ-'+new Date(b.at).toLocaleString('he-IL')+'? הנתונים הנוכחיים יוחלפו.'))return;S=JSON.parse(b.data);migrate();await cloudSave();alert('הגיבוי שוחזר בהצלחה')}catch(e){alert('שגיאה בשחזור: '+e.message)}}
async function resetAll(){if(!uid)return;await backupNow();S=defState();await cloudSave();$('rstM').classList.remove('op');alert('הנתונים אופסו. גיבוי נשמר וניתן לשחזור מההגדרות.')}

// ===== CONFIG =====
const DEC=['עובר ושב','קרן כספית','פיקדון אישי','ביטוח ישיר - כללי','ביטוח ישיר - מניות','מיטב','מיטב טרייד','מנורה מבטחים - תגמולים ופיצויים','מנורה מבטחים - גמל להשקעה','הראל השתלמות','מנורה מבטחים השתלמות','פנסיה'];

// ===== ISRAELI TAX ENGINE (2026, עוסק מורשה) =====
function vatR(mk){return mk>='2025-01'?0.18:0.17}
const BRK=[{u:84120,r:.1},{u:120720,r:.14},{u:193800,r:.2},{u:269280,r:.31},{u:560280,r:.35},{u:721560,r:.47},{u:1/0,r:.5}];
function calcIT(a){if(a<=0)return 0;let t=0,p=0;for(const b of BRK){const x=Math.min(a,b.u)-p;if(x<=0)break;t+=x*b.r;p=b.u}return t}
const IT_CREDIT=6534; // 2.25 נקודות זיכוי שנתי
// ביטוח לאומי עצמאי: 5.97% עד 60% מהשכר הממוצע, 17.83% מעל, עד תקרה
const BL_LOW_ANNUAL=95880, BL_CEIL_ANNUAL=608340;
function calcBL(a){if(a<=0)return 0;const low=Math.min(a,BL_LOW_ANNUAL);const high=Math.max(0,Math.min(a,BL_CEIL_ANNUAL)-BL_LOW_ANNUAL);return low*.0597+high*.1783}

const EXC=[
 {id:'rent',n:'שכירות משרד',rec:1,vat:1},

function calcYearTax(yr){
  const yI=(S.incomes||[]).filter(i=>i.month&&i.month.startsWith(yr));
  const yE=(S.expenses||[]).filter(e=>e.month&&e.month.startsWith(yr));
  const yP=(S.taxPayments||[]).filter(p=>p.month&&p.month.startsWith(yr));
  // הכנסות ללא מע"מ + מע"מ עסקאות
  let revEx=0,vatOut=0;
  yI.forEach(i=>{const r=vatR(i.month);revEx+=i.amount/(1+r);vatOut+=i.amount*r/(1+r)});
  // הוצאות: מע"מ תשומות רק להוצאות עם מע"מ; ניכוי הוצאה לפי סוג
  let vatIn=0,bizEx=0,pen=0,hish=0;
  yE.forEach(e=>{
    const c=EXC.find(x=>x.id===e.cat);if(!c||!c.rec)return;
    const f=c.p||1,r=vatR(e.month);
    if(e.cat==='pension'){pen+=e.amount;return}
    if(e.cat==='hishtalmut'){hish+=e.amount;return}
    if(c.vat){vatIn+=e.amount*f*r/(1+r);bizEx+=e.amount*f/(1+r)}
    else{bizEx+=e.amount*f}
  });
  const vE=vatOut-vatIn; // מע"מ לתשלום
  const Y0=Math.max(0,revEx-bizEx); // רווח לפני הטבות
  // ניכוי 52% מביט"ל ששולם בפועל
  const blPaid=yP.filter(p=>p.type==='bituach_leumi').reduce((s,p)=>s+p.amount,0);
  const blDed=blPaid*.52;
  // פנסיה עצמאי: ניכוי עד 11%, זיכוי 35% על עוד עד 5.5%
  const penDed=Math.min(pen,.11*Y0);
  const penCr=.35*Math.min(Math.max(0,pen-penDed),.055*Y0);
  // השתלמות עצמאי: ניכוי עד 4.5% מהכנסה, תקרה שנתית
  const hishDed=Math.min(hish,Math.min(.045*Y0,13203));
  // אנואליזציה לפי חודשים קיימים בשנה
  const mCount=Math.max(1,Object.keys(S.months||{}).filter(k=>k.startsWith(yr)).length);
  const af=12/mCount;
  const taxable=Math.max(0,Y0-blDed-penDed-hishDed);
  const iE=Math.max(0,calcIT(taxable*af)-IT_CREDIT-penCr*af)/af;
  const bE=calcBL(Y0*af)/af;
  const vP=yP.filter(p=>p.type==='vat').reduce((s,p)=>s+p.amount,0);
  const iP=yP.filter(p=>p.type==='income_adv'||p.type==='income_annual').reduce((s,p)=>s+p.amount,0);
  return{yr,revEx,bizEx,pen,hish,Y0,taxable,blDed,penDed,penCr,hishDed,vE,iE,bE,vP,iP,bP:blPaid,mCount};
}

      if(S.months[m]){S.months[m]['עובר ושב']=(S.months[m]['עובר ושב']||0)-amt;S.months[m][rawTo]=(S.months[m][rawTo]||0)+amt}
      depAdd(dispOf(rawTo),amt);
    }
  });
  if(!S.fixedDone)S.fixedDone={};
  S.fixedDone[m]=true;save();renderCur();
}

  const k=$('eM').value;if(!k)return;
  const nI=(S.incomes||[]).filter(i=>i.month===k).length,nE=(S.expenses||[]).filter(e=>e.month===k).length,nT=(S.transfers||[]).filter(t=>t.month===k).length,nP=(S.taxPayments||[]).filter(p=>p.month===k).length;
  let msg='למחוק את '+ml(k)+'?';
  if(nI+nE+nT+nP>0)msg+='\nיימחקו גם: '+nI+' הכנסות, '+nE+' הוצאות, '+nT+' העברות, '+nP+' תשלומי מס.';

  delete S.months[k];
  S.incomes=(S.incomes||[]).filter(i=>i.month!==k);S.expenses=(S.expenses||[]).filter(e=>e.month!==k);
  S.transfers=(S.transfers||[]).filter(t=>t.month!==k);S.taxPayments=(S.taxPayments||[]).filter(p=>p.month!==k);

function addTr(){
  const m=$('tM').value,f=$('tF').value,t=$('tT').value,a=+$('tA').value;
  if(!m||!f||!t||!a||a<=0)return alert('מלא את כל השדות');
  if(f===t)return alert('בחר שני חשבונות שונים');
  S.transfers.push({id:Date.now(),month:m,from:f,to:t,amount:a});
  if(S.months[m]){S.months[m][f]=(S.months[m][f]||0)-a;S.months[m][t]=(S.months[m][t]||0)+a}
  depAdd(dispOf(t),a);
  if(f!=='עובר ושב')depAdd(dispOf(f),-a);
  save();$('tA').value='';rTL();
}
function delTr(id){
  const t=S.transfers.find(x=>x.id===id);if(!t||!confirm('למחוק העברה של '+fmt(t.amount)+'?'))return;
  if(S.months[t.month]){S.months[t.month][t.from]=(S.months[t.month][t.from]||0)+t.amount;S.months[t.month][t.to]=(S.months[t.month][t.to]||0)-t.amount}
  depAdd(dispOf(t.to),-t.amount);
  if(t.from!=='עובר ושב')depAdd(dispOf(t.from),t.amount);
  S.transfers=S.transfers.filter(x=>x.id!==id);save();rTL();
}

function expJSON(){const b=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='finboard_'+new Date().toISOString().slice(0,10)+'.json';a.click()}
async function impJSON(inp){
  const f=inp.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=async e=>{
    try{
      const d=JSON.parse(e.target.result);
      if(!d.months||!d.cats)return alert('קובץ לא תקין — חסרים נתוני חודשים/קטגוריות');
      await backupNow();
      S=d;migrate();await cloudSave();
      alert('הייבוא הצליח! '+Object.keys(S.months).length+' חודשים נטענו. גיבוי של המצב הקודם נשמר.');
      renderCur();
    }catch(x){alert('שגיאה בקריאת הקובץ: '+x.message)}
  };
  r.readAsText(f);inp.value='';
}
